version: 1
metadata:
  name: home-system
  labels:
    blueprints.goauthentik.io/description: "Home System - OIDC provider and application"

entries:
  # ── Admin role ───────────────────────────────────────────────────────────────
  # Members of this group (and Authentik superusers such as akadmin) get
  # `roles: ["admin"]` in their tokens, which the API's Admin policy checks
  # (dead-letter admin pages, /api/admin/*). The SPA requests the `roles` scope.
  - model: authentik_core.group
    id: group-admins
    state: present
    identifiers:
      name: home-system-admins

  - model: authentik_providers_oauth2.scopemapping
    id: scope-roles
    state: present
    identifiers:
      name: "home-system: roles"
    attrs:
      scope_name: roles
      description: "Home System roles"
      expression: |
        is_admin = request.user.is_superuser or ak_is_group_member(request.user, name="home-system-admins")
        return {"roles": ["admin"] if is_admin else []}

  # ── OAuth2/OIDC Provider ─────────────────────────────────────────────────────
  # Public client (PKCE) used by the React SPA.
  # The API validates tokens issued by this provider — no separate API provider needed.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-home-system
    state: present
    identifiers:
      name: home-system
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: "I476Ik4ahckZS00sx9zmad8ennJdhDr7Fb1LpoMH"
      # Update these for non-local environments
      redirect_uris:
        - url: "http://localhost:5173/callback"
          matching_mode: strict
        - url: "http://localhost:5173/silent-renew"
          matching_mode: strict
        - url: "http://localhost:5173"
          matching_mode: strict
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]
        - !KeyOf scope-roles

  # ── E2E Test Users ───────────────────────────────────────────────────────────
  # Used exclusively by Playwright E2E tests. One user per Playwright worker so
  # the suite can run in parallel with full per-user data isolation. Usernames
  # match e2e/shared/auth.setup.ts; the shared password is read from the
  # E2E_USER_PASSWORD environment variable (see infrastructure/.env.example).
  #
  # The single legacy `E2eTestsUser` is retired via `state: absent`. Keep the
  # entry for one release so Authentik removes the row cleanly on next startup,
  # then delete it.
  - model: authentik_core.user
    state: absent
    identifiers:
      username: E2eTestsUser

  - model: authentik_core.user
    state: present
    identifiers:
      username: E2eWorker0
    attrs:
      name: E2E Worker 0
      email: e2e-worker-0@test.local
      is_active: true
      password: !Env E2E_USER_PASSWORD

  - model: authentik_core.user
    state: present
    identifiers:
      username: E2eWorker1
    attrs:
      name: E2E Worker 1
      email: e2e-worker-1@test.local
      is_active: true
      password: !Env E2E_USER_PASSWORD

  - model: authentik_core.user
    state: present
    identifiers:
      username: E2eWorker2
    attrs:
      name: E2E Worker 2
      email: e2e-worker-2@test.local
      is_active: true
      password: !Env E2E_USER_PASSWORD

  - model: authentik_core.user
    state: present
    identifiers:
      username: E2eWorker3
    attrs:
      name: E2E Worker 3
      email: e2e-worker-3@test.local
      is_active: true
      password: !Env E2E_USER_PASSWORD

  # A fifth user reserved for cross-user specs (e.g. household invitations) that need a
  # second identity with no household of its own. Outside the WORKER_COUNT=4 pool used by
  # playwright.config.ts, so it's never assigned to a worker and never seeded a household —
  # borrowing a pool worker for this would break the "one Authentik user per worker, no
  # shared data" isolation the pool exists for.
  - model: authentik_core.user
    state: present
    identifiers:
      username: E2eInvitee
    attrs:
      name: E2E Invitee
      email: e2e-invitee@test.local
      is_active: true
      password: !Env E2E_USER_PASSWORD

  # Admin identity for the /admin (dead letters) spec — the only E2E user in
  # home-system-admins, so the worker pool keeps exercising the non-admin path.
  - model: authentik_core.user
    state: present
    identifiers:
      username: E2eAdmin
    attrs:
      name: E2E Admin
      email: e2e-admin@test.local
      is_active: true
      password: !Env E2E_USER_PASSWORD
      groups:
        - !KeyOf group-admins

  # ── Application ──────────────────────────────────────────────────────────────
  - model: authentik_core.application
    state: present
    identifiers:
      slug: home-system
    attrs:
      name: home-system
      provider: !KeyOf provider-home-system
      policy_engine_mode: any

  # ── MCP client (docs/design/mcp/AUTH.md) ─────────────────────────────────────
  # Own provider for MCP clients, so SPA tokens cannot call /mcp and MCP tokens
  # cannot call REST. First client: Claude Code with a pre-registered client id
  # and a fixed callback port:
  #   claude mcp add --transport http --client-id home-system-mcp --callback-port 33418 \
  #     home-system http://localhost:5050/mcp
  # Grants are scopes; the API checks them per tool from the token's `scope` claim.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-mcp-diet-read
    state: present
    identifiers:
      name: "home-system-mcp: diet read"
    attrs:
      scope_name: "mcp:diet:read"
      description: "Read your diet planner data"
      expression: |
        # Authentik keeps granted scopes off the JWT; the API reads them from this claim.
        # Discovery evaluates mappings without a token, so return nothing there.
        try:
            granted = token.scope
        except NameError:
            return {}
        return {"scope": " ".join(granted)}

  - model: authentik_providers_oauth2.scopemapping
    id: scope-mcp-diet-write
    state: present
    identifiers:
      name: "home-system-mcp: diet write"
    attrs:
      scope_name: "mcp:diet:write"
      description: "Create products and recipes"
      expression: |
        # Authentik keeps granted scopes off the JWT; the API reads them from this claim.
        # Discovery evaluates mappings without a token, so return nothing there.
        try:
            granted = token.scope
        except NameError:
            return {}
        return {"scope": " ".join(granted)}

  - model: authentik_providers_oauth2.scopemapping
    id: scope-mcp-diet-import
    state: present
    identifiers:
      name: "home-system-mcp: diet import"
    attrs:
      scope_name: "mcp:diet:import"
      description: "Import monthly meal plans"
      expression: |
        # Authentik keeps granted scopes off the JWT; the API reads them from this claim.
        # Discovery evaluates mappings without a token, so return nothing there.
        try:
            granted = token.scope
        except NameError:
            return {}
        return {"scope": " ".join(granted)}

  - model: authentik_providers_oauth2.scopemapping
    id: scope-mcp-investments-read
    state: present
    identifiers:
      name: "home-system-mcp: investments read"
    attrs:
      scope_name: "mcp:investments:read"
      description: "Read your investment wallets and net worth"
      expression: |
        # Authentik keeps granted scopes off the JWT; the API reads them from this claim.
        # Discovery evaluates mappings without a token, so return nothing there.
        try:
            granted = token.scope
        except NameError:
            return {}
        return {"scope": " ".join(granted)}

  - model: authentik_providers_oauth2.scopemapping
    id: scope-mcp-investments-write
    state: present
    identifiers:
      name: "home-system-mcp: investments write"
    attrs:
      scope_name: "mcp:investments:write"
      description: "Manage your investment wallets and balances"
      expression: |
        # Authentik keeps granted scopes off the JWT; the API reads them from this claim.
        # Discovery evaluates mappings without a token, so return nothing there.
        try:
            granted = token.scope
        except NameError:
            return {}
        return {"scope": " ".join(granted)}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-home-system-mcp
    state: present
    identifiers:
      name: home-system-mcp
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      # Explicit consent: the user sees which grants the client asks for.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: home-system-mcp
      redirect_uris:
        - url: "http://localhost:33418/callback"
          matching_mode: strict
        - url: "http://127.0.0.1:33418/callback"
          matching_mode: strict
      # Same sub mode as the SPA provider: both must issue the same `sub` for one user.
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]
        - !KeyOf scope-mcp-diet-read
        - !KeyOf scope-mcp-diet-write
        - !KeyOf scope-mcp-diet-import
        - !KeyOf scope-mcp-investments-read
        - !KeyOf scope-mcp-investments-write

  - model: authentik_core.application
    state: present
    identifiers:
      slug: home-system-mcp
    attrs:
      name: home-system-mcp
      provider: !KeyOf provider-home-system-mcp
      policy_engine_mode: any