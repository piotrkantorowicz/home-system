# SPA server for the UI image (Dockerfile). /api, /hubs, /health and /openapi are routed to the
# API by the ingress, so this only serves static files.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }

    # Must never be cached: they change per deploy without changing their URL.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints everything under /assets; a missing asset is a 404, not the app shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
