# Builds the Home System API image (src/Apis/HomeSystem.REST/Dockerfile) and smoke-tests it.
#
# - pull_request: build + smoke only. Nothing is pushed and no job holds packages:write.
# - workflow_call (from release.yml, every push to main): publishes ghcr.io/<repo>-api:sha-<commit>,
#   plus :vX.Y.Z when `tag` is set. The tag's own commit is checked out, so a version can only
#   ever point at the commit semantic-release tagged.
# - workflow_dispatch: retry publishing an existing release tag (no new release is created).
# Publishing uses the workflow's GITHUB_TOKEN; no PAT.
name: API image

on:
  pull_request:
    branches: [main, 'epic/**']
    paths:
      - 'src/Apis/**'
      - 'src/Modules/**'
      - 'src/Shared/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.dockerignore'
      - 'scripts/smoke-api-image.sh'
      - '.github/workflows/api-image.yml'
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z) to also publish; empty publishes the commit SHA tag only'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish, e.g. v1.4.2'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Validate release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not vX.Y.Z"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::$TAG is not on main"; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Apis/HomeSystem.REST/Dockerfile
          platforms: linux/amd64
          load: true
          tags: home-system-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-api-image.sh home-system-api:ci

  publish:
    name: Publish to GHCR
    # Never on pull requests; only the main branch (release.yml / manual run on main) may publish.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.sha is main's head on a manual retry; the image must carry the checked-out commit.
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=sha-${{ steps.commit.outputs.sha }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Apis/HomeSystem.REST/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
