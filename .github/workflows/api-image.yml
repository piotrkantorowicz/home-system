# Builds the Home System API image (src/Apis/HomeSystem.REST/Dockerfile) and smoke-tests it.
#
# - pull_request: build + smoke only. Nothing is pushed and no job holds packages:write.
# - workflow_call (from release.yml, every push to main): publishes ghcr.io/<repo>-api:sha-<commit>,
#   plus :vX.Y.Z when `tag` is set. The tag's own commit is checked out, so a version can only
#   ever point at the commit semantic-release tagged.
# - workflow_dispatch: retry publishing an existing release tag (no new release is created).
# Publishing uses the workflow's GITHUB_TOKEN; no PAT.
name: API image

on:
  pull_request:
    branches: [main, 'epic/**']
    paths:
      - 'src/Apis/**'
      - 'src/Modules/**'
      - 'src/Shared/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.dockerignore'
      - 'scripts/smoke-api-image.sh'
      - '.github/workflows/api-image.yml'
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z) to also publish; empty publishes the commit SHA tag only'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish, e.g. v1.4.2'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Trivy SARIF upload
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Validate release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not vX.Y.Z"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::$TAG is not on main"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Apis/HomeSystem.REST/Dockerfile
          platforms: linux/amd64
          load: true
          tags: home-system-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-api-image.sh home-system-api:ci

      # Report first, gate second: the SARIF run always uploads so findings reach code
      # scanning even when the gate fails. Accepted findings go in a root .trivyignore (read by
      # default), one CVE per line with a reason comment.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: home-system-api:ci
          version: v0.76.1
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      # Dependabot and fork PRs get a read-only token, so the upload can't succeed there;
      # the gate below still runs for them.
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-api-image

      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: home-system-api:ci
          version: v0.76.1
          skip-setup-trivy: true
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish to GHCR
    # Never on pull requests; only the main branch (release.yml / manual run on main) may publish.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.sha is main's head on a manual retry; the image must carry the checked-out commit.
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=sha-${{ steps.commit.outputs.sha }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Apis/HomeSystem.REST/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
