name: CodeQL

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'epic/**']
  schedule:
    - cron: '23 4 * * 1'   # weekly — picks up new queries against unchanged code

concurrency:
  group: codeql-${{ github.ref }}
  # Only PR runs are superseded; a push or cron scan on main must finish so its results land.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
      actions: read            # needed by the `actions` language
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # C# is extracted from source, no solution build — keeps the job independent
          # of backend-ci and the .NET SDK version.
          build-mode: none
          # actions/unpinned-tag is excluded: repo policy references actions by tag, not SHA
          # (Dependabot keeps the tags current).
          config: |
            queries:
              - uses: security-and-quality
            # docs/** holds static design prototypes, not shipped code.
            paths-ignore:
              - docs/**
            query-filters:
              - exclude:
                  id: actions/unpinned-tag

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
