name: CodeQL

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'epic/**']
  schedule:
    - cron: '23 4 * * 1'   # weekly — picks up new queries against unchanged code

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
      actions: read            # needed by the `actions` language
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: C# is extracted from source, no solution build — keeps the job
        # independent of backend-ci and the .NET SDK version.
        language: [csharp, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
