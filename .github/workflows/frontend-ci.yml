name: Frontend CI

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'epic/**']

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type Check, Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui

    steps:
      # dorny/paths-filter needs the repo checked out (it shells out to local git for
      # push events) — checkout always runs first, unconditionally, then the filter
      # decides whether the rest of the job does real work. Required status check must
      # always report, so the workflow always triggers instead of being skipped via
      # `on.paths`, which leaves a required check stuck pending forever on unrelated PRs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'src/ui/**'
              - '.github/workflows/frontend-ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/ui/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: npm ci

      - name: Type check
        if: steps.filter.outputs.relevant == 'true'
        run: npm run type-check

      - name: Lint
        if: steps.filter.outputs.relevant == 'true'
        run: npm run lint

      - name: Format check
        if: steps.filter.outputs.relevant == 'true'
        run: npm run format:check

      - name: Test with coverage
        if: steps.filter.outputs.relevant == 'true'
        run: npm run test:coverage

      - name: Build
        if: steps.filter.outputs.relevant == 'true'
        run: npm run build
