# Builds the Home System UI image (src/ui/Dockerfile) and smoke-tests it. Mirrors api-image.yml.
#
# - pull_request: build + smoke only. Nothing is pushed and no job holds packages:write.
# - workflow_call (from release.yml, every push to main): publishes ghcr.io/<repo>-ui:sha-<commit>,
#   plus :vX.Y.Z when `tag` is set. The tag's own commit is checked out, so a version can only
#   ever point at the commit semantic-release tagged.
# - workflow_dispatch: publish main's head (empty tag) or (re)publish an existing release tag.
# Publishing uses the workflow's GITHUB_TOKEN; no PAT.
name: UI image

on:
  pull_request:
    branches: [main, 'epic/**']
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z) to also publish; empty publishes the commit SHA tag only'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish, e.g. v1.4.2; empty publishes sha-<commit> of main'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: UI build & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # paths-filter lists the PR's files
      security-events: write   # Trivy SARIF upload
    steps:
      # Before checkout: the tag becomes a git ref there. publish needs this job, so it is covered.
      - name: Check tag format
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::''$TAG'' is not vX.Y.Z"; exit 1; }'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Check for relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'src/ui/**'
              - '.trivyignore'
              - 'scripts/smoke-ui-image.sh'
              - '.github/workflows/ui-image.yml'

      - name: Validate release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::$TAG is not on main"; exit 1; }

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'

      - name: Build image
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        uses: docker/build-push-action@v7
        with:
          context: src/ui
          platforms: linux/amd64
          load: true
          tags: home-system-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      - name: Smoke test
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: scripts/smoke-ui-image.sh home-system-ui:ci

      # Report first, gate second, as in api-image.yml.
      - name: Scan image (report)
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: home-system-ui:ci
          version: v0.76.1
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload scan results
        if: github.event_name != 'pull_request' || (steps.filter.outputs.relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-ui-image

      - name: Scan image (gate)
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: home-system-ui:ci
          version: v0.76.1
          skip-setup-trivy: true
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish UI to GHCR
    # Never on pull requests; only the main branch (release.yml / manual run on main) may publish.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.sha is main's head on a manual retry; the image must carry the checked-out commit.
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-ui
          tags: |
            type=raw,value=sha-${{ steps.commit.outputs.sha }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src/ui
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui
