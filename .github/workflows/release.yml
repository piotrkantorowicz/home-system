# Tags and publishes a GitHub Release from the Conventional Commits on main.
# Config: release.config.js (root). No files are committed back — the version is the tag.
#
# Runs after every push to main. main only receives squash-merged feature PRs and
# rebase-merged epic PRs, both CI-checked on the PR, so the release job does not re-run
# the test suites.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tags + releases
      issues: write          # "released in vX.Y.Z" comments
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # The tag semantic-release put on this exact commit ("" when the push released nothing).
      - name: Resolve release tag
        id: tag
        run: |
          git fetch --tags --quiet origin
          echo "tag=$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)" >> "$GITHUB_OUTPUT"

  # Called explicitly: tags pushed with GITHUB_TOKEN do not trigger other workflows.
  # Publishes sha-<commit> for every main commit, plus the version tag when one was released.
  image:
    name: API image
    needs: release
    permissions:
      contents: read
      packages: write
      pull-requests: read      # api-image.yml's build job declares it for paths-filter
      security-events: write   # api-image.yml uploads its Trivy scan
    uses: ./.github/workflows/api-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
