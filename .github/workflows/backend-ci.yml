name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/Apis/**'
      - 'src/Modules/**'
      - 'src/Shared/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'HomeSystem.slnx'
      - '.editorconfig'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Apis/**'
      - 'src/Modules/**'
      - 'src/Shared/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'HomeSystem.slnx'
      - '.editorconfig'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HomeSystem.slnx

      - name: Format check
        run: dotnet format HomeSystem.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build HomeSystem.slnx --no-restore --configuration Release

      # Every *.UnitTests / *.Tests / *.IntegrationTests project in the solution.
      # Integration tests use Testcontainers — Docker is available on ubuntu-latest.
      - name: Run all tests
        run: |
          dotnet test HomeSystem.slnx \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=minimal" \
            --logger trx \
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          retention-days: 7
