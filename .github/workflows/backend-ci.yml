name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/apis/**'
      - 'Directory.Build.props'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/apis/**'
      - 'Directory.Build.props'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/apis/diet-planner/DietPlanner.slnx

      - name: Build
        run: dotnet build src/apis/diet-planner/DietPlanner.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test src/apis/diet-planner/DietPlanner.Tests/DietPlanner.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName!~Integration" \
            --logger "console;verbosity=minimal"

      - name: Run integration tests
        run: |
          dotnet test src/apis/diet-planner/DietPlanner.Tests/DietPlanner.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~Integration" \
            --logger "console;verbosity=minimal"
