name: Backend CI

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'epic/**']

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # dorny/paths-filter needs the repo checked out (it shells out to local git for
      # push events) — checkout always runs first, unconditionally, then the filter
      # decides whether the rest of the job does real work. Required status check must
      # always report, so the workflow always triggers instead of being skipped via
      # `on.paths`, which leaves a required check stuck pending forever on unrelated PRs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'src/Apis/**'
              - 'src/Modules/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'HomeSystem.slnx'
              - '.editorconfig'
              - '.github/workflows/backend-ci.yml'

      - name: Setup .NET 10
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet restore HomeSystem.slnx

      - name: Format check
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet format HomeSystem.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet build HomeSystem.slnx --no-restore --configuration Release

      # Every *.UnitTests / *.Tests / *.IntegrationTests project in the solution.
      # Integration tests use Testcontainers — Docker is available on ubuntu-latest.
      - name: Run all tests
        if: steps.filter.outputs.relevant == 'true'
        run: |
          dotnet test --solution HomeSystem.slnx \
            --no-build \
            --configuration Release \
            --results-directory TestResults \
            --report-xunit-trx

      - name: Upload test results
        if: always() && steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          retention-days: 7
