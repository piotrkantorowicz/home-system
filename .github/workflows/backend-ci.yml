name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/Api/**'
      - 'src/Modules/**'
      - 'src/Shared/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'HomeSystem.slnx'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Api/**'
      - 'src/Modules/**'
      - 'src/Shared/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'HomeSystem.slnx'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HomeSystem.slnx

      - name: Build
        run: dotnet build HomeSystem.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test tests/DietPlanner.UnitTests/DietPlanner.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=minimal"

      - name: Run integration tests
        run: |
          dotnet test tests/DietPlanner.IntegrationTests/DietPlanner.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=minimal"
