version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /            # release tooling only (semantic-release)
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /src/ui
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @eslint/js majors track eslint majors. eslint-plugin-import and
      # eslint-plugin-jsx-a11y still peer on eslint ^9, so @eslint/js 10 cannot be
      # installed next to them — drop this once both support eslint 10 (#328).
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
