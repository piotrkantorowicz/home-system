          <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Recipes</h1>
          <p style="margin: 0; font-size: 15px; color: #625d6b">12 recipes · nutrition per serving</p>
        </div>

          <input type="search" placeholder="Search recipes or ingredients" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14.5px; color: #1f1c25">

        <div role="group" aria-label="Filter" style="display: flex; gap: 6px; flex-wrap: wrap">

                <span style="width: {{r.pC}}%; background: #d08a1f"></span>
                <span style="width: {{r.pF}}%; background: #b8458c"></span>
              </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Overnight oats with blueberries', 420, 18, 62, 11, 10], ['Greek yogurt, honey & walnuts', 310, 20, 24, 15, 5],
      ['Chicken & quinoa bowl', 610, 46, 58, 19, 30], ['Hummus with carrot sticks', 220, 8, 22, 11, 5],
      ['Salmon, roasted potatoes & greens', 640, 42, 48, 28, 35], ['Scrambled eggs on rye', 450, 26, 34, 22, 10],
      ['Lentil soup', 380, 22, 52, 7, 40], ['Turkey wrap', 520, 38, 46, 18, 15],
      ['Apple & peanut butter', 260, 7, 28, 14, 2], ['Beef stir-fry with rice', 690, 40, 72, 22, 25],
      ['Cottage cheese with tomatoes', 240, 24, 10, 10, 5], ['Pasta primavera', 580, 20, 88, 16, 25]
    ];
    const recipes = data.map((d) => {
      const kp = d[2] * 4, kc = d[3] * 4, kf = d[4] * 9, t = kp + kc + kf;
      const pP = Math.round(kp / t * 100), pC = Math.round(kc / t * 100), pF = 100 - pP - pC;
      return {
        name: d[0], kcal: String(d[1]), time: d[5] + ' min',
        pP, pC, pF,
        split: 'Calories from protein ' + pP + '%, carbs ' + pC + '%, fat ' + pF + '%',
        macros: d[2] + ' g protein · ' + d[3] + ' g carbs · ' + d[4] + ' g fat'
      };
    });
    return { recipes };
  }
}
</script>
