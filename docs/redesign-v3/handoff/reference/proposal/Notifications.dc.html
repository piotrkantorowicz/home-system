<body>

        <span style="font-size: 12.5px; color: #625d6b">Kantorowicz Home</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625d6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>

    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid #e4e1ea; border-radius: 10px; background: #ffffff; font: inherit; font-size: 14px; color: #625d6b; cursor: pointer">

    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #625d6b; padding: 0 12px 6px">Library</span>
      <a href="Recipes.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #3b3742; text-decoration: none; font-size: 14.5px; font-weight: 500">

      <a href="Products.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #3b3742; text-decoration: none; font-size: 14.5px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path><path d="M12 22V12"></path><path d="m3.3 7 8.7 5 8.7-5"></path></svg>Products</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #625d6b; padding: 0 12px 6px">Track</span>
      <a href="Nutrition.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #3b3742; text-decoration: none; font-size: 14.5px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg>Nutrition</a>
      <a href="Water.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #3b3742; text-decoration: none; font-size: 14.5px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg>Water</a>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 12px; border-top: 1px solid #e4e1ea">
      <a href="Household.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #3b3742; text-decoration: none; font-size: 14.5px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Household</a>
      <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; background: #ece6fd; color: #4b1aa3; text-decoration: none; font-size: 14.5px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
        <span style="flex: 1">Notifications</span>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 600; color: #ffffff; background: #6f32e2; border-radius: 6px; padding: 1px 7px">{{unread}}</span></sc-if></a>
      <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; color: #3b3742; text-decoration: none; font-size: 14.5px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg>Settings</a>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #e0d6fb; color: #4b1aa3; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">PK</span>
        <span style="font-size: 14px; font-weight: 500">Paweł K.</span>
      </div>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 48px 64px">
    <div style="max-width: 760px; display: flex; flex-direction: column; gap: 20px">
      <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Notifications</h1>
          <p style="margin: 0; font-size: 15px; color: #625d6b">{{subtitle}}</p>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" onClick="{{markAll}}" disabled="{{noUnread}}" style="height: 40px; padding: 0 14px; border: 1px solid #d9d5e1; border-radius: 10px; background: #ffffff; font: inherit; font-size: 14.5px; font-weight: 500; color: {{markAllColor}}; cursor: pointer">Mark all as read</button>
          <a href="SettingsApp.dc.html" aria-label="Notification settings" style="width: 40px; height: 40px; box-sizing: border-box; border: 1px solid #d9d5e1; border-radius: 10px; background: #ffffff; color: #1f1c25; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"></path></svg></a>
        </div>
      </header>

      <div role="group" aria-label="Show" style="display: flex; gap: 6px">
        <button type="button" onClick="{{showAll}}" aria-pressed="{{allPressed}}" style="height: 36px; padding: 0 12px; border: 1px solid {{allBorder}}; border-radius: 6px; background: {{allBg}}; font: inherit; font-size: 14px; font-weight: 600; color: {{allColor}}; cursor: pointer">All</button>
        <button type="button" onClick="{{showUnread}}" aria-pressed="{{unreadPressed}}" style="height: 36px; padding: 0 12px; border: 1px solid {{unBorder}}; border-radius: 6px; background: {{unBg}}; font: inherit; font-size: 14px; font-weight: 600; color: {{unColor}}; cursor: pointer">Unread · {{unread}}</button>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #625d6b">{{g.label}}</h2>
          <ul style="margin: 0; padding: 4px 8px; list-style: none; background: #ffffff; border: 1px solid #e4e1ea; border-radius: 16px">
            <sc-for list="{{g.items}}" as="n" hint-placeholder-count="2">
              <li style="border-top: {{n.divider}}">
                <button type="button" onClick="{{n.open}}" style="width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: start; padding: 14px 12px 14px 8px; border: 0; background: transparent; font: inherit; text-align: left; color: inherit; cursor: pointer">
                  <span style="width: 40px; height: 40px; border-radius: 10px; background: {{n.tileBg}}; color: {{n.tileColor}}; display: flex; align-items: center; justify-content: center">
                    <sc-if value="{{n.isMeal}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg></sc-if>
                    <sc-if value="{{n.isPeople}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
                    <sc-if value="{{n.isWater}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg></sc-if>
                    <sc-if value="{{n.isChart}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg></sc-if>
                  </span>
                  <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                    <span style="font-size: 15.5px; font-weight: {{n.weight}}; color: #1f1c25">{{n.title}}</span>
                    <span style="font-size: 14.5px; line-height: 1.45; color: #4d4856">{{n.body}}</span>
                    <span style="font-size: 13px; font-weight: 500; color: #5720b6; margin-top: 2px">{{n.action}}</span>
                  </span>
                  <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #625d6b; white-space: nowrap; padding-top: 2px">{{n.time}}
                    <sc-if value="{{n.unread}}" hint-placeholder-val="{{true}}"><span aria-label="Unread" role="img" style="width: 9px; height: 9px; border-radius: 50%; background: #6f32e2"></span></sc-if>
                  </span>
                </button>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; padding: 32px 24px; text-align: center; font-size: 15px; color: #625d6b; background: #ffffff; border: 1px solid #e4e1ea; border-radius: 16px">You're all caught up.</p>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { read: { n3: true, n4: true }, filter: 'all' };
  }
  renderVals() {
    const read = this.state.read || {};
    const filter = this.state.filter;
    const kinds = {
      meal: ['#f1ecfe', '#4b1aa3'], people: ['#e6eefa', '#1f4f91'],
      water: ['#e3f2f7', '#1f6e8a'], chart: ['#f1eff4', '#4d4856']
    };
    const all = [
      { id: 'n1', g: 'Today', kind: 'meal', title: 'Lunch in 15 minutes', body: 'Turkey wrap · 520 kcal', action: 'Open today', time: '13:15' },
      { id: 'n2', g: 'Earlier', kind: 'people', title: 'Ania joined Kantorowicz Home', body: 'She can now see shared recipes and the shopping list.', action: 'View household', time: 'Yesterday' },
      { id: 'n3', g: 'Earlier', kind: 'water', title: 'Time for a glass of water', body: '1.3 of 2.5 L so far today', action: 'Log water', time: 'Fri 15:30' },
      { id: 'n4', g: 'Earlier', kind: 'chart', title: 'Your week: 2 106 kcal a day', body: 'On target 4 of 7 days. Protein 17 g short on average.', action: 'See nutrition', time: 'Sun 27 Sep' }
    ];
    const unreadCount = all.filter((n) => !read[n.id]).length;
    const visible = all.filter((n) => filter === 'all' || !read[n.id]);
    const groups = ['Today', 'Earlier'].map((label) => {
      const items = visible.filter((n) => n.g === label).map((n, i) => ({
        ...n, divider: i === 0 ? '0' : '1px solid #efedf2',
        unread: !read[n.id], weight: read[n.id] ? 500 : 700,
        tileBg: kinds[n.kind][0], tileColor: kinds[n.kind][1],
        isMeal: n.kind === 'meal', isPeople: n.kind === 'people', isWater: n.kind === 'water', isChart: n.kind === 'chart',
        open: () => this.setState({ read: { ...this.state.read, [n.id]: true } })
      }));
      return { label, items };
    }).filter((g) => g.items.length > 0);
    const on = { border: '#6f32e2', bg: '#f1ecfe', color: '#4b1aa3' };
    const off = { border: '#d9d5e1', bg: '#ffffff', color: '#3b3742' };
    const a = filter === 'all' ? on : off, u = filter === 'all' ? off : on;
    return {
      groups, empty: groups.length === 0,
      unread: unreadCount, hasUnread: unreadCount > 0, noUnread: unreadCount === 0,
      subtitle: unreadCount === 0 ? 'Nothing new' : unreadCount + ' unread',
      markAllColor: unreadCount === 0 ? '#8a8494' : '#1f1c25',
      markAll: () => this.setState({ read: { n1: true, n2: true, n3: true, n4: true } }),
      showAll: () => this.setState({ filter: 'all' }), showUnread: () => this.setState({ filter: 'unread' }),
      allPressed: filter === 'all' ? 'true' : 'false', unreadPressed: filter === 'all' ? 'false' : 'true',
      allBorder: a.border, allBg: a.bg, allColor: a.color, unBorder: u.border, unBg: u.bg, unColor: u.color
    };
  }
}
</script>
</body>
