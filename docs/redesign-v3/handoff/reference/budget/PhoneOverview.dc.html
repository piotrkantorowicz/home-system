<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget on phone — proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5720b6}a:hover{color:#3f1690}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1180px; overflow: hidden; background: #f6f5f8; font-family: Outfit, system-ui, sans-serif; color: #1f1c25">
  <div style="box-sizing: border-box; padding: 16px 16px 108px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <a href="ModuleSwitcher.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; color: #1f1c25; text-decoration: none">
        <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Budget</h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#625d6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <div style="display: flex; align-items: center; gap: 2px">
        <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #1f1c25; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
        <span style="font-size: 15px; font-weight: 600">October</span>
        <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #1f1c25; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
    </header>

    <div role="group" aria-label="Whose spending" style="display: grid; grid-template-columns: 1fr 1fr; padding: 3px; background: #ebe8f0; border-radius: 10px">
      <button type="button" onClick="{{showShared}}" aria-pressed="{{sharedPressed}}" style="height: 38px; border: 0; border-radius: 8px; background: {{sharedBg}}; font: inherit; font-size: 14.5px; font-weight: {{sharedWeight}}; color: #1f1c25; cursor: pointer">Shared</button>
      <button type="button" onClick="{{showMine}}" aria-pressed="{{minePressed}}" style="height: 38px; border: 0; border-radius: 8px; background: {{mineBg}}; font: inherit; font-size: 14.5px; font-weight: {{mineWeight}}; color: #1f1c25; cursor: pointer">Just mine</button>
    </div>

    <section aria-label="Spent this month" style="background: #ffffff; border: 1px solid #e4e1ea; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500; color: #625d6b">{{totalLabel}}</span>
      <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{total}}</span><span style="font-size: 15px; color: #625d6b">PLN</span></span>
      <span style="font-size: 13.5px; color: #625d6b">{{totalNote}}</span>
    </section>

    <sc-if value="{{isShared}}" hint-placeholder-val="{{true}}">
      <a href="PhoneSettle.dc.html" style="display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 1px solid #e0d6fb; border-radius: 16px; background: #f8f5ff; color: #1f1c25; text-decoration: none">
        <span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500; color: #4b1aa3">Settle up</span><span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">You owe Ania 505.73</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b1aa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
    </sc-if>

    <section aria-labelledby="penv-h" style="background: #ffffff; border: 1px solid #e4e1ea; border-radius: 16px; padding: 16px 16px 6px">
      <h2 id="penv-h" style="margin: 0 0 4px; font-size: 17px; font-weight: 600">Envelopes</h2>
      <sc-for list="{{envelopes}}" as="e" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 7px; padding: 12px 0; border-top: 1px solid #efedf2">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">{{e.name}}</span>
            <span style="font-size: 14px; font-variant-numeric: tabular-nums"><strong style="font-weight: 600">{{e.spent}}</strong><span style="color: #625d6b">{{e.limitText}}</span></span>
          </div>
          <sc-if value="{{e.hasLimit}}" hint-placeholder-val="{{true}}">
            <div style="position: relative; height: 8px; border-radius: 6px; background: #ebe8f0">
              <div style="width: {{e.pct}}%; height: 8px; border-radius: 6px; background: {{e.fill}}"></div>
              <sc-if value="{{e.over}}" hint-placeholder-val="{{false}}"><div style="position: absolute; top: -4px; left: {{e.tick}}%; width: 2px; height: 16px; border-radius: 1px; background: #1f1c25"></div></sc-if>
            </div>
          </sc-if>
          <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: {{e.statusWeight}}; color: {{e.statusColor}}">
            <sc-if value="{{e.over}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></sc-if>{{e.status}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="plat-h" style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
        <h2 id="plat-h" style="margin: 0; font-size: 17px; font-weight: 600">Latest</h2>
        <a href="PhoneExpenses.dc.html" style="font-size: 14px; font-weight: 500; text-decoration: none">All expenses</a>
      </div>
      <ul style="margin: 0; padding: 2px 14px; list-style: none; background: #ffffff; border: 1px solid #e4e1ea; border-radius: 16px">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
          <li style="border-top: {{r.divider}}">
            <a href="ExpenseDetail.dc.html" style="display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; min-height: 58px; color: #1f1c25; text-decoration: none">
              <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 500">{{r.what}}</span><span style="font-size: 13px; color: #625d6b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span></span>
              <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.amount}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>

  <nav aria-label="Budget" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 6px 8px 22px; background: #ffffff; border-top: 1px solid #e4e1ea; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #4b1aa3; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Overview</a>
    <a href="PhoneExpenses.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #625d6b; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 17.5v-11"></path></svg>Expenses</a>
    <a href="AddExpensePhone.dc.html" aria-label="Add expense" style="justify-self: center; width: 52px; height: 52px; border-radius: 16px; background: #6f32e2; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -6px rgba(111,50,226,0.6)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></a>
    <a href="PhoneSettle.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #625d6b; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg>Settle up</a>
    <a href="Envelopes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #625d6b; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scope: 'shared' };
  }
  renderVals() {
    const fmt = (n) => {
      const [i, d] = n.toFixed(2).split('.');
      return i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + d;
    };
    const shared = this.state.scope === 'shared';
    const defs = shared ? [['Everyday', 2947.25, 3000], ['Holidays', 1200, 1000], ['Car', 310, null]] : [['Pocket money', 139, 300]];
    const envelopes = defs.map((e) => {
      const has = e[2] !== null, over = has && e[1] > e[2];
      const scale = has ? Math.max(e[1], e[2]) : 1;
      return {
        name: e[0], spent: fmt(e[1]), limitText: has ? ' / ' + fmt(e[2]) : '', hasLimit: has, over,
        pct: has ? Math.round(e[1] / scale * 100) : 0, tick: has ? Math.round(e[2] / scale * 100) : 0,
        fill: over ? '#c9464c' : '#6f32e2',
        status: !has ? 'No limit' : over ? fmt(e[1] - e[2]) + ' over the limit' : fmt(e[2] - e[1]) + ' left',
        statusColor: over ? '#b42b31' : '#625d6b', statusWeight: over ? 600 : 500
      };
    });
    const rdefs = shared
      ? [['Electricity, September', 'Everyday · household account · today', 249.99], ['Lidl', 'Everyday · Ania paid · split · yesterday', 184.36], ['Fuel, Orlen', 'Car · you paid · split · yesterday', 310]]
      : [['Cinema', 'Pocket money · 2 Oct', 99], ['Polish course book', 'Pocket money · 1 Oct', 40]];
    const recent = rdefs.map((r, i) => ({ what: r[0], meta: r[1], amount: fmt(r[2]), divider: i === 0 ? '0' : '1px solid #efedf2' }));
    const on = '#ffffff', off = 'transparent';
    return {
      envelopes, recent, isShared: shared,
      total: fmt(shared ? 4457.25 : 139),
      totalLabel: shared ? 'Shared spending · October' : 'Your personal spending · October',
      totalNote: shared ? '6 expenses · 1 envelope over its limit' : 'Only you can see this',
      showShared: () => this.setState({ scope: 'shared' }), showMine: () => this.setState({ scope: 'mine' }),
      sharedPressed: shared ? 'true' : 'false', minePressed: shared ? 'false' : 'true',
      sharedBg: shared ? on : off, mineBg: shared ? off : on, sharedWeight: shared ? 600 : 500, mineWeight: shared ? 500 : 600
    };
  }
}
</script>
</body>
</html>
