<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense on phone — proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="ph-h" style="width: 390px; height: 844px; background: #ffffff; font-family: Outfit, system-ui, sans-serif; color: #1f1c25; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px; border-bottom: 1px solid #efedf2; flex: none">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #1f1c25; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    <h2 id="ph-h" style="margin: 0; font-size: 17px; font-weight: 600">Add expense</h2>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px">
    <label style="display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 13px; font-weight: 600; color: #625d6b">Amount
      <span style="display: flex; align-items: baseline; justify-content: center; gap: 8px; width: 100%; padding: 4px 0 10px; border-bottom: 2px solid #6f32e2">
        <input type="text" inputmode="decimal" value="{{amount}}" onChange="{{setAmount}}" placeholder="0.00" style="width: 180px; border: 0; outline: none; text-align: right; font: inherit; font-size: 40px; font-weight: 600; color: #1f1c25; font-variant-numeric: tabular-nums">
        <span style="font-size: 18px; font-weight: 500; color: #625d6b">PLN</span>
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: #4d4856">What for <span style="font-weight: 400; color: #625d6b">(optional)</span>
      <input type="text" value="Lidl" placeholder="e.g. Lidl, electricity bill" style="height: 48px; padding: 0 12px; border: 1px solid #d9d5e1; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; color: #1f1c25"></label>
    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0 0 8px; font-size: 13.5px; font-weight: 600; color: #4d4856">Category</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 40px; padding: 0 12px; border: 1px solid {{c.border}}; border-radius: 6px; background: {{c.bg}}; font: inherit; font-size: 14.5px; font-weight: {{c.weight}}; color: {{c.color}}; cursor: pointer">{{c.name}}</button>
        </sc-for>
      </div>
    </fieldset>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: #4d4856">Envelope
        <select style="height: 48px; padding: 0 8px; border: 1px solid #d9d5e1; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 400; color: #1f1c25"><option>Everyday</option><option>Holidays</option><option>Car</option><option>Personal</option></select></label>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="pdate-l" style="font-size: 13.5px; font-weight: 600; color: #4d4856">Date</span>
        <button type="button" aria-labelledby="pdate-l" style="height: 48px; padding: 0 12px; border: 1px solid #d9d5e1; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; color: #1f1c25; text-align: left; cursor: pointer">Today</button>
      </div>
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0 0 8px; font-size: 13.5px; font-weight: 600; color: #4d4856">Who paid?</legend>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{payers}}" as="p" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 52px; padding: 0 12px; border: {{p.border}}; border-radius: 10px; background: {{p.bg}}; font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px">
            <span style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: {{p.avBg}}; color: {{p.avColor}}; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.initials}}</span>
            <span style="flex: 1; font-size: 15.5px; font-weight: {{p.weight}}; color: #1f1c25">{{p.name}}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>
    <sc-if value="{{isPerson}}" hint-placeholder-val="{{true}}">
      <fieldset style="margin: 0; padding: 0; border: 0">
        <legend style="padding: 0 0 8px; font-size: 13.5px; font-weight: 600; color: #4d4856">Split equally between</legend>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{parts}}" as="s" hint-placeholder-count="2">
            <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: 1px solid {{s.border}}; border-radius: 10px; background: {{s.bg}}; cursor: pointer">
              <input type="checkbox" checked="{{s.on}}" onChange="{{s.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: #6f32e2">
              <span style="flex: 1; font-size: 15.5px; font-weight: 500">{{s.name}}</span>
              <span style="font-size: 15.5px; font-weight: 600; color: {{s.shareColor}}; font-variant-numeric: tabular-nums">{{s.share}}</span>
            </label>
          </sc-for>
        </div>
      </fieldset>
    </sc-if>
    <sc-if value="{{isHousehold}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0; padding: 12px 14px; border-radius: 10px; background: #f6f5f8; font-size: 14.5px; line-height: 1.5; color: #3b3742">Paid from the household account — nothing to split.</p>
    </sc-if>
  </div>
  <div style="flex: none; padding: 12px 16px 24px; border-top: 1px solid #efedf2; background: #ffffff">
    <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 10px; background: #6f32e2; font: inherit; font-size: 16px; font-weight: 600; color: #ffffff; cursor: pointer">{{saveLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '184.36', cat: 'Groceries', payer: 'ania', parts: { pawel: true, ania: true } };
  }
  renderVals() {
    const st = this.state;
    const fmt = (n) => {
      const [i, d] = n.toFixed(2).split('.');
      return i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + d;
    };
    const cents = Math.round((parseFloat(String(st.amount).replace(',', '.')) || 0) * 100);
    const cats = ['Groceries', 'Housing', 'Utilities', 'Transport', 'Health', 'Leisure', 'Education', 'Other'].map((n) => {
      const on = st.cat === n;
      return { name: n, pressed: on ? 'true' : 'false', border: on ? '#6f32e2' : '#d9d5e1', bg: on ? '#f1ecfe' : '#ffffff', color: on ? '#4b1aa3' : '#3b3742', weight: on ? 600 : 500, pick: () => this.setState({ cat: n }) };
    });
    const payers = [['pawel', 'You', 'PK', '#e0d6fb', '#4b1aa3'], ['ania', 'Ania', 'AK', '#d6e4f7', '#1f4f91'], ['household', 'Household account', 'H', '#ebe8f0', '#4d4856']].map((p) => {
      const on = st.payer === p[0];
      return { name: p[1], initials: p[2], avBg: p[3], avColor: p[4], pressed: on ? 'true' : 'false', border: on ? '2px solid #6f32e2' : '1px solid #d9d5e1', bg: on ? '#f8f5ff' : '#ffffff', weight: on ? 600 : 500, pick: () => this.setState({ payer: p[0] }) };
    });
    const people = [['pawel', 'You'], ['ania', 'Ania']];
    const chosen = people.filter((p) => st.parts[p[0]]);
    const each = chosen.length ? Math.floor(cents / chosen.length) : 0;
    const rem = chosen.length ? cents - each * chosen.length : 0;
    let idx = 0;
    const parts = people.map((p) => {
      const on = !!st.parts[p[0]];
      let share = '—';
      if (on && cents > 0) { share = fmt((each + (idx === 0 ? rem : 0)) / 100); idx++; }
      return { name: p[1], on, share, shareColor: on ? '#1f1c25' : '#8a8494', border: on ? '#c9b8f5' : '#e4e1ea', bg: on ? '#fbf9ff' : '#ffffff', toggle: () => this.setState({ parts: { ...this.state.parts, [p[0]]: !this.state.parts[p[0]] } }) };
    });
    return {
      amount: st.amount, cats, payers, parts,
      setAmount: (e) => this.setState({ amount: e.target.value }),
      isPerson: st.payer !== 'household', isHousehold: st.payer === 'household',
      saveLabel: cents > 0 ? 'Save ' + fmt(cents / 100) + ' PLN' : 'Save'
    };
  }
}
</script>
</body>
</html>
