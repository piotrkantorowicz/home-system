<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense — proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 760px; height: 940px; box-sizing: border-box; padding: 40px; background: rgba(31,28,37,0.45); font-family: Outfit, system-ui, sans-serif; color: #1f1c25; display: flex; align-items: center; justify-content: center">
  <div role="dialog" aria-modal="true" aria-labelledby="add-h" style="width: 100%; max-width: 600px; background: #ffffff; border-radius: 16px; box-shadow: 0 24px 64px -16px rgba(20,10,40,0.45); display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 8px">
      <h2 id="add-h" style="margin: 0; font-size: 20px; font-weight: 600">Add expense</h2>
      <button type="button" aria-label="Close" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #4d4856; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </div>
    <div style="padding: 8px 24px 20px; display: flex; flex-direction: column; gap: 20px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: #4d4856">Amount
        <span style="display: flex; align-items: baseline; gap: 10px; padding: 8px 16px; border: 2px solid #6f32e2; border-radius: 10px">
          <input type="text" inputmode="decimal" value="{{amount}}" onChange="{{setAmount}}" placeholder="0.00" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 36px; font-weight: 600; color: #1f1c25; font-variant-numeric: tabular-nums">
          <span style="font-size: 18px; font-weight: 500; color: #625d6b">PLN</span>
        </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: #4d4856">What for <span style="font-weight: 400; color: #625d6b">(optional)</span>
        <input type="text" value="Lidl" placeholder="e.g. Lidl, electricity bill" style="height: 44px; padding: 0 12px; border: 1px solid #d9d5e1; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 400; color: #1f1c25"></label>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0 0 8px; font-size: 13.5px; font-weight: 600; color: #4d4856">Category</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
            <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 36px; padding: 0 12px; border: 1px solid {{c.border}}; border-radius: 6px; background: {{c.bg}}; font: inherit; font-size: 14px; font-weight: {{c.weight}}; color: {{c.color}}; cursor: pointer">{{c.name}}</button>
          </sc-for>
        </div>
      </fieldset>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: #4d4856">Envelope
          <select style="height: 44px; padding: 0 10px; border: 1px solid #d9d5e1; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 400; color: #1f1c25"><option>Everyday · shared</option><option>Holidays · shared</option><option>Car · shared</option><option>Personal · only you</option></select></label>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span id="date-l" style="font-size: 13.5px; font-weight: 600; color: #4d4856">Date</span>
          <button type="button" aria-labelledby="date-l" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border: 1px solid #d9d5e1; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; color: #1f1c25; cursor: pointer">Today, 3 Oct<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#625d6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></button>
        </div>
      </div>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0 0 8px; font-size: 13.5px; font-weight: 600; color: #4d4856">Who paid?</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{payers}}" as="p" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 52px; padding: 8px 10px; border: {{p.border}}; border-radius: 10px; background: {{p.bg}}; font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px">
              <span style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: {{p.avBg}}; color: {{p.avColor}}; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.initials}}</span>
              <span style="font-size: 14.5px; font-weight: {{p.weight}}; color: #1f1c25; line-height: 1.25">{{p.name}}</span>
            </button>
          </sc-for>
        </div>
      </fieldset>
      <sc-if value="{{isPerson}}" hint-placeholder-val="{{true}}">
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
          <legend style="padding: 0 0 8px; font-size: 13.5px; font-weight: 600; color: #4d4856">Split equally between</legend>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{parts}}" as="s" hint-placeholder-count="2">
              <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 1px solid {{s.border}}; border-radius: 10px; background: {{s.bg}}; cursor: pointer">
                <input type="checkbox" checked="{{s.on}}" onChange="{{s.toggle}}" style="width: 20px; height: 20px; margin: 0; accent-color: #6f32e2">
                <span style="flex: 1; font-size: 15px; font-weight: 500">{{s.name}}</span>
                <span style="font-size: 15px; font-weight: 600; color: {{s.shareColor}}; font-variant-numeric: tabular-nums">{{s.share}}</span>
              </label>
            </sc-for>
          </div>
        </fieldset>
      </sc-if>
      <sc-if value="{{isHousehold}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; padding: 12px 14px; border-radius: 10px; background: #f6f5f8; font-size: 14px; line-height: 1.5; color: #3b3742">Paid from the household account — nobody is owed anything and there's nothing to split.</p>
      </sc-if>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid #efedf2; background: #fbfafc">
      <span style="font-size: 13px; color: #625d6b">Recorded by you</span>
      <div style="display: flex; gap: 8px">
        <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #d9d5e1; border-radius: 10px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 500; color: #1f1c25; cursor: pointer">Cancel</button>
        <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #6f32e2; font: inherit; font-size: 15px; font-weight: 600; color: #ffffff; cursor: pointer">{{saveLabel}}</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":940}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '184.36', cat: 'Groceries', payer: 'ania', parts: { pawel: true, ania: true } };
  }
  renderVals() {
    const st = this.state;
    const fmt = (n) => {
      const [i, d] = n.toFixed(2).split('.');
      return i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + d;
    };
    const cents = Math.round((parseFloat(String(st.amount).replace(',', '.')) || 0) * 100);
    const catNames = ['Groceries', 'Housing', 'Utilities', 'Transport', 'Health', 'Leisure', 'Education', 'Other'];
    const cats = catNames.map((n) => {
      const on = st.cat === n;
      return { name: n, pressed: on ? 'true' : 'false', border: on ? '#6f32e2' : '#d9d5e1', bg: on ? '#f1ecfe' : '#ffffff', color: on ? '#4b1aa3' : '#3b3742', weight: on ? 600 : 500, pick: () => this.setState({ cat: n }) };
    });
    const payerDefs = [['pawel', 'You', 'PK', '#e0d6fb', '#4b1aa3'], ['ania', 'Ania', 'AK', '#d6e4f7', '#1f4f91'], ['household', 'Household account', 'H', '#ebe8f0', '#4d4856']];
    const payers = payerDefs.map((p) => {
      const on = st.payer === p[0];
      return { name: p[1], initials: p[2], avBg: p[3], avColor: p[4], pressed: on ? 'true' : 'false', border: on ? '2px solid #6f32e2' : '1px solid #d9d5e1', bg: on ? '#f8f5ff' : '#ffffff', weight: on ? 600 : 500, pick: () => this.setState({ payer: p[0] }) };
    });
    const people = [['pawel', 'You'], ['ania', 'Ania']];
    const chosen = people.filter((p) => st.parts[p[0]]);
    const each = chosen.length ? Math.floor(cents / chosen.length) : 0;
    const rem = chosen.length ? cents - each * chosen.length : 0;
    let idx = 0;
    const parts = people.map((p) => {
      const on = !!st.parts[p[0]];
      let share = '—';
      if (on && cents > 0) { share = fmt((each + (idx === 0 ? rem : 0)) / 100); idx++; }
      return {
        name: p[1], on, share, shareColor: on ? '#1f1c25' : '#8a8494',
        border: on ? '#c9b8f5' : '#e4e1ea', bg: on ? '#fbf9ff' : '#ffffff',
        toggle: () => this.setState({ parts: { ...this.state.parts, [p[0]]: !this.state.parts[p[0]] } })
      };
    });
    return {
      amount: st.amount, cats, payers, parts,
      setAmount: (e) => this.setState({ amount: e.target.value }),
      isPerson: st.payer !== 'household', isHousehold: st.payer === 'household',
      saveLabel: cents > 0 ? 'Save ' + fmt(cents / 100) : 'Save'
    };
  }
}
</script>
</body>
</html>
